name: Production Smoke Tests

on:
  # Run manually
  workflow_dispatch:
  
  # Run after deployments (requires webhook setup)
  # deployment_status:
  
  # Run on schedule (every 6 hours)
  schedule:
    - cron: '0 */6 * * *'

jobs:
  smoke-tests:
    name: Run Production Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium webkit
      
      - name: Run smoke tests
        working-directory: ./frontend
        run: npm run test:smoke
        env:
          PRODUCTION_URL: https://tributestream.com
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report-${{ github.run_number }}
          path: frontend/playwright-report/
          retention-days: 30
      
      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results-${{ github.run_number }}
          path: frontend/playwright-report/production-results.json
          retention-days: 30
      
      # Optional: Notify on failure
      - name: Notify on failure
        if: failure()
        run: |
          echo "🚨 Production smoke tests failed!"
          echo "Check the test report artifact for details"
          # Add Slack/Discord/Email notification here
      
      # Optional: Comment on PR if triggered by deployment
