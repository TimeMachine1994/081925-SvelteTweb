<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Switcher - Interactive Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        .animate-pulse-fast {
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="bg-black text-gray-100 h-screen w-screen flex flex-col overflow-hidden font-sans select-none">

    <!-- HEADER -->
    <header class="h-14 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-4 shrink-0 z-20 shadow-md">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 bg-red-950/30 border border-red-900/50 px-2 py-1 rounded text-red-500 text-xs font-bold tracking-wider">
                <div class="w-2 h-2 bg-red-500 rounded-full animate-pulse-fast"></div>
                LIVE
            </div>
            <div class="h-4 w-px bg-gray-700"></div>
            <div class="flex flex-col">
                <span class="text-xs font-semibold text-gray-300">Session #8X92</span>
                <span class="text-[10px] text-gray-500 font-mono" id="clock">00:00:00</span>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="toggleModal('qr-modal')" class="group flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-md text-xs font-medium transition-all shadow-lg shadow-blue-900/20 active:scale-95">
                <i data-lucide="qr-code" class="w-3.5 h-3.5 group-hover:scale-110 transition-transform"></i>
                <span>Connect Phone</span>
            </button>
            <button class="p-2 hover:bg-gray-800 rounded-full text-gray-400 hover:text-white transition">
                <i data-lucide="settings" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- MAIN STAGE (PROGRAM) -->
    <main class="flex-1 relative bg-black flex items-center justify-center overflow-hidden">
        
        <!-- Main Video Element (Mocked with Image) -->
        <img id="program-feed" src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=1920&auto=format&fit=crop" class="w-full h-full object-contain transition-opacity duration-300">
        
        <!-- Tally Overlay -->
        <div class="absolute top-4 right-4 flex items-center gap-2">
            <div class="bg-black/60 backdrop-blur text-white px-3 py-1 rounded border border-white/10 text-[10px] font-bold tracking-widest uppercase shadow-xl">
                Program Out
            </div>
        </div>

        <!-- Audio Monitor Overlay -->
        <div class="absolute bottom-6 left-6 transition-all duration-300 transform translate-y-0 opacity-100" id="audio-monitor">
            <div class="bg-black/80 backdrop-blur-md pl-3 pr-4 py-2.5 rounded-lg border border-gray-800 flex items-center gap-3 shadow-2xl">
                <div id="monitor-icon-container" class="bg-green-500/10 p-1.5 rounded-md">
                    <i data-lucide="mic" class="w-4 h-4 text-green-400"></i>
                </div>
                
                <div class="flex flex-col gap-1 w-32">
                    <div class="flex justify-between text-[9px] text-gray-400 font-bold uppercase tracking-wide">
                        <span id="monitor-label">Audio: Input 1</span>
                        <span class="text-green-400 font-mono">-6dB</span>
                    </div>
                    <!-- Fake VU Meter Animation -->
                    <div class="h-1.5 w-full bg-gray-700/50 rounded-full overflow-hidden flex">
                        <div class="h-full bg-gradient-to-r from-green-600 via-green-400 to-yellow-400 w-[70%] animate-pulse"></div>
                    </div>
                    <div class="h-1.5 w-full bg-gray-700/50 rounded-full overflow-hidden flex">
                        <div class="h-full bg-gradient-to-r from-green-600 via-green-400 to-yellow-400 w-[60%] animate-pulse delay-75"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- SWITCHER RAIL -->
    <section class="h-auto bg-[#0a0a0a] border-t border-gray-800 flex flex-col shrink-0 z-30 pb-safe">
        
        <!-- Tools Bar -->
        <div class="h-10 flex items-center justify-between px-4 border-b border-gray-800 bg-gray-900/50">
            <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Source Bus</span>
            <div class="flex gap-2">
                 <button class="hover:bg-gray-800 p-1.5 rounded text-gray-400 transition" title="Grid View">
                    <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
                 </button>
            </div>
        </div>

        <!-- Scrollable Inputs -->
        <div class="flex overflow-x-auto no-scrollbar p-3 gap-3">

            <!-- INPUT 1 -->
            <div id="source-1" class="source-card relative group flex-shrink-0 w-48 flex flex-col gap-1.5" data-img="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=600&auto=format&fit=crop" data-name="Guest (Mobile)">
                <div onclick="switchVideo('source-1')" class="preview-box relative w-full h-28 bg-gray-800 rounded-lg overflow-hidden border-2 border-transparent hover:border-gray-600 transition-all cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=300&auto=format&fit=crop" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition duration-300">
                    <div class="absolute inset-0 bg-red-500/10 opacity-0 active-state-layer transition-opacity"></div>
                </div>
                
                <div class="flex items-center justify-between bg-gray-900 border border-gray-800 rounded px-2 py-1.5">
                    <span class="text-xs font-medium text-gray-300 truncate w-20">Guest 1</span>
                    <div class="flex gap-1">
                        <button onclick="togglePin('source-1')" class="pin-btn w-6 h-6 flex items-center justify-center rounded hover:bg-gray-800 text-gray-500 transition-colors">
                            <i data-lucide="pin" class="w-3 h-3"></i>
                        </button>
                        <button onclick="toggleMute('source-1')" class="mute-btn w-6 h-6 flex items-center justify-center rounded hover:bg-gray-800 text-gray-500 transition-colors">
                            <i data-lucide="mic" class="w-3 h-3"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- INPUT 2 -->
            <div id="source-2" class="source-card relative group flex-shrink-0 w-48 flex flex-col gap-1.5" data-img="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=1920&auto=format&fit=crop" data-name="Event Main">
                <div onclick="switchVideo('source-2')" class="preview-box relative w-full h-28 bg-gray-800 rounded-lg overflow-hidden border-2 border-red-500 cursor-pointer shadow-[0_0_15px_rgba(220,38,38,0.4)]">
                    <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=300&auto=format&fit=crop" class="w-full h-full object-cover">
                    <!-- Program Badge -->
                    <div class="program-badge absolute top-1 left-1/2 -translate-x-1/2 bg-red-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded shadow-sm">PGM</div>
                </div>
                
                <div class="flex items-center justify-between bg-gray-900 border border-red-900/30 rounded px-2 py-1.5">
                    <span class="text-xs font-bold text-red-400 truncate w-20">Main Cam</span>
                    <div class="flex gap-1">
                        <button onclick="togglePin('source-2')" class="pin-btn w-6 h-6 flex items-center justify-center rounded hover:bg-gray-800 text-gray-500 transition-colors">
                            <i data-lucide="pin" class="w-3 h-3"></i>
                        </button>
                        <button onclick="toggleMute('source-2')" class="mute-btn w-6 h-6 flex items-center justify-center rounded hover:bg-gray-800 text-gray-500 transition-colors">
                            <i data-lucide="mic" class="w-3 h-3"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- INPUT 3 -->
            <div id="source-3" class="source-card relative group flex-shrink-0 w-48 flex flex-col gap-1.5" data-img="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?q=80&w=600&auto=format&fit=crop" data-name="Wide Shot">
                <div onclick="switchVideo('source-3')" class="preview-box relative w-full h-28 bg-gray-800 rounded-lg overflow-hidden border-2 border-transparent hover:border-gray-600 transition-all cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?q=80&w=300&auto=format&fit=crop" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition duration-300">
                </div>
                
                <div class="flex items-center justify-between bg-gray-900 border border-gray-800 rounded px-2 py-1.5">
                    <span class="text-xs font-medium text-gray-300 truncate w-20">Wide Shot</span>
                    <div class="flex gap-1">
                        <button onclick="togglePin('source-3')" class="pin-btn w-6 h-6 flex items-center justify-center rounded hover:bg-gray-800 text-gray-500 transition-colors">
                            <i data-lucide="pin" class="w-3 h-3"></i>
                        </button>
                        <button onclick="toggleMute('source-3')" class="mute-btn w-6 h-6 flex items-center justify-center rounded hover:bg-gray-800 text-gray-500 transition-colors">
                            <i data-lucide="mic" class="w-3 h-3"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- INPUT 4 (FILE) -->
            <div id="source-4" class="source-card relative group flex-shrink-0 w-48 flex flex-col gap-1.5" data-img="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop" data-name="B-Roll File">
                <div onclick="switchVideo('source-4')" class="preview-box relative w-full h-28 bg-gray-800 rounded-lg overflow-hidden border-2 border-transparent hover:border-gray-600 transition-all cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=300&auto=format&fit=crop" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition duration-300">
                    <div class="absolute bottom-1 right-1 bg-black/70 px-1 rounded text-[8px] font-mono text-white">00:34</div>
                </div>
                
                <div class="flex items-center justify-between bg-gray-900 border border-gray-800 rounded px-2 py-1.5">
                    <span class="text-xs font-medium text-blue-400 truncate w-20">Intro_v2.mp4</span>
                    <div class="flex gap-1">
                        <button onclick="togglePin('source-4')" class="pin-btn w-6 h-6 flex items-center justify-center rounded hover:bg-gray-800 text-gray-500 transition-colors">
                            <i data-lucide="pin" class="w-3 h-3"></i>
                        </button>
                        <button onclick="toggleMute('source-4')" class="mute-btn w-6 h-6 flex items-center justify-center rounded hover:bg-gray-800 text-gray-500 transition-colors">
                            <i data-lucide="mic" class="w-3 h-3"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ADD NEW BTN -->
            <div class="shrink-0 w-24 h-[154px] border-2 border-dashed border-gray-800 hover:border-gray-600 rounded-lg flex flex-col items-center justify-center gap-2 cursor-pointer transition hover:bg-gray-900 text-gray-600 hover:text-gray-400">
                <i data-lucide="plus" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium text-center">Add Input</span>
            </div>

        </div>
    </section>

    <!-- QR MODAL -->
    <div id="qr-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-gray-900 border border-gray-700 text-gray-100 p-6 rounded-2xl flex flex-col items-center gap-6 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-300" id="qr-content">
            <div class="flex justify-between w-full items-center">
                <h3 class="text-lg font-bold">Connect Mobile Source</h3>
                <button onclick="toggleModal('qr-modal')" class="text-gray-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div class="w-56 h-56 bg-white rounded-xl flex items-center justify-center p-2 relative">
                <!-- Fake QR Code -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://example.com/join/session-8x92" class="w-full h-full object-contain mix-blend-multiply opacity-90">
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                     <i data-lucide="scan" class="w-12 h-12 text-black/10"></i>
                </div>
            </div>

            <p class="text-center text-gray-400 text-xs px-4">Scan to instantly join session <strong>#8X92</strong> as a camera source.</p>
            
            <div class="flex flex-col w-full gap-2">
                <div class="flex items-center gap-2 bg-black/50 p-2.5 rounded border border-gray-800">
                    <i data-lucide="link" class="w-3.5 h-3.5 text-blue-500"></i>
                    <code class="text-xs text-blue-400 flex-1 truncate font-mono">stream.app/j/8x92-lm</code>
                    <button class="text-gray-500 hover:text-white transition"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Init Icons
        lucide.createIcons();

        // State
        let activeVideoId = 'source-2'; // Default Live
        let activeAudioId = 'source-2'; // Default Audio follows video initially
        let pinnedAudioId = null;       // None pinned initially
        let muteMap = {};               // Track mute state per source

        // --- Functions ---

        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('clock').innerText = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleModal(id) {
            const el = document.getElementById(id);
            const content = document.getElementById('qr-content');
            
            if(el.classList.contains('hidden')) {
                // Open
                el.classList.remove('hidden');
                // Small timeout to allow display:block to apply before opacity transition
                setTimeout(() => {
                    el.classList.remove('opacity-0');
                    content.classList.remove('scale-95');
                    content.classList.add('scale-100');
                }, 10);
            } else {
                // Close
                el.classList.add('opacity-0');
                content.classList.remove('scale-100');
                content.classList.add('scale-95');
                setTimeout(() => {
                    el.classList.add('hidden');
                }, 300);
            }
        }

        // Logic: Switching Video
        function switchVideo(sourceId) {
            const oldId = activeVideoId;
            activeVideoId = sourceId;

            // 1. Update Visuals of Thumbnails
            document.querySelectorAll('.source-card').forEach(card => {
                const previewBox = card.querySelector('.preview-box');
                const badge = previewBox.querySelector('.program-badge');
                
                // Reset styling
                previewBox.classList.remove('border-red-500', 'shadow-[0_0_15px_rgba(220,38,38,0.4)]');
                previewBox.classList.add('border-transparent');
                
                if (badge) badge.remove(); // Remove old badges

                // Apply Active Styling
                if(card.id === sourceId) {
                    previewBox.classList.remove('border-transparent');
                    previewBox.classList.add('border-red-500', 'shadow-[0_0_15px_rgba(220,38,38,0.4)]');
                    
                    // Add Badge
                    const badgeEl = document.createElement('div');
                    badgeEl.className = 'program-badge absolute top-1 left-1/2 -translate-x-1/2 bg-red-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded shadow-sm';
                    badgeEl.innerText = 'PGM';
                    previewBox.appendChild(badgeEl);
                }
            });

            // 2. Update Main Output Image
            const sourceCard = document.getElementById(sourceId);
            const newImgSrc = sourceCard.getAttribute('data-img');
            
            const mainImg = document.getElementById('program-feed');
            // Simple crossfade sim
            mainImg.style.opacity = 0;
            setTimeout(() => {
                mainImg.src = newImgSrc;
                mainImg.style.opacity = 1;
            }, 150);

            // 3. Handle Audio Switching Logic
            // If we have a PINNED audio source, we do NOT change audio.
            // If NO pinned audio, Audio follows Video.
            if (!pinnedAudioId) {
                activeAudioId = sourceId;
                updateAudioMonitor();
            }
        }

        // Logic: Pinning Audio
        function togglePin(sourceId) {
            // If clicking the already pinned source, unpin it (return to follow-video mode)
            if (pinnedAudioId === sourceId) {
                pinnedAudioId = null;
                activeAudioId = activeVideoId; // Revert to current video
            } else {
                pinnedAudioId = sourceId;
                activeAudioId = sourceId;
            }
            
            updateAudioMonitor();
            updateButtonStates();
        }

        function toggleMute(sourceId) {
            muteMap[sourceId] = !muteMap[sourceId];
            updateButtonStates();
            // If we muted the currently active audio, visually update monitor?
            // For simplicity, we just update icons here.
        }

        function updateButtonStates() {
            document.querySelectorAll('.source-card').forEach(card => {
                const id = card.id;
                const pinBtn = card.querySelector('.pin-btn');
                const muteBtn = card.querySelector('.mute-btn');
                const pinIcon = pinBtn.querySelector('svg');
                const muteIcon = muteBtn.querySelector('svg');

                // Update Pin Button Visuals
                if (id === pinnedAudioId) {
                    pinBtn.classList.add('bg-green-500/20', 'text-green-400', 'border', 'border-green-500/50');
                    pinBtn.classList.remove('text-gray-500');
                    pinIcon.classList.add('fill-current');
                } else {
                    pinBtn.classList.remove('bg-green-500/20', 'text-green-400', 'border', 'border-green-500/50');
                    pinBtn.classList.add('text-gray-500');
                    pinIcon.classList.remove('fill-current');
                }

                // Update Mute Button Visuals
                if (muteMap[id]) {
                    muteBtn.classList.add('bg-red-900/50', 'text-red-400');
                    muteBtn.classList.remove('text-gray-500');
                    // Change icon to mic-off logic (simple approach: color change)
                } else {
                    muteBtn.classList.remove('bg-red-900/50', 'text-red-400');
                    muteBtn.classList.add('text-gray-500');
                }
            });
        }

        function updateAudioMonitor() {
            const monitorLabel = document.getElementById('monitor-label');
            const sourceCard = document.getElementById(activeAudioId);
            const sourceName = sourceCard ? sourceCard.getAttribute('data-name') : 'Unknown';
            const monitorContainer = document.getElementById('audio-monitor');

            monitorLabel.innerText = `Audio: ${sourceName}`;
            
            // Visual feedback that audio source changed
            monitorContainer.classList.add('scale-105');
            setTimeout(() => monitorContainer.classList.remove('scale-105'), 200);
        }

        // Initialize state
        updateButtonStates();
        
    </script>
</body>
</html>
